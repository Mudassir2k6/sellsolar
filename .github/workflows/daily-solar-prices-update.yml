name: Daily Solar Price Benchmark Update at 12:00 AM Midnight

on:
  schedule:
    # Runs every day at 19:00 UTC (which is exactly 00:00 / 12:00 AM Pakistan Standard Time PKT UTC+5)
    - cron: '0 19 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-daily-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # needed to trigger the Cloudflare deploy workflow below
    env:
      # Optional email alert (repo Settings -> Secrets and variables -> Actions)
      #   MAIL_USERNAME = Gmail address that sends the mail
      #   MAIL_PASSWORD = Gmail App Password (not the normal password)
      #   MAIL_TO       = who receives the alert (defaults to MAIL_USERNAME)
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO || secrets.MAIL_USERNAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install --no-package-lock

      - name: Run Midnight Solar Price Update (Preserving Customer & Dealer Ads)
        id: prices
        run: node scripts/update-today-prices.js

      - name: Commit and push if prices updated
        id: commit
        run: |
          git config --global user.name "SellSolar Price Bot"
          git config --global user.email "bot@sellsolar.pk"
          git add src/data/todayPricesData.js src/data/autoFetchedRates.js public/daily_price_update_log.json
          if git diff --staged --quiet; then
            echo "No price changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: auto-update solar benchmark prices & fallback tracking (12:00 AM)"
          git pull --rebase --autostash origin main
          git push origin main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with the default GITHUB_TOKEN do NOT start the push-triggered deploy,
      # so start the Cloudflare deploy explicitly (workflow_dispatch is allowed for GITHUB_TOKEN).
      - name: Deploy updated prices to sellsolar.pk
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloudflare.yml --ref main

      # Date-wise prices are ALWAYS shown on the website (previous verified rates are carried forward
      # and lightly highlighted when no live Pakistani quote is matched).
      - name: Email alert - carry-forward / no new live changes
        if: steps.prices.outputs.price_status == 'NO_CHANGE' && env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ env.MAIL_USERNAME }}
          password: ${{ env.MAIL_PASSWORD }}
          to: ${{ env.MAIL_TO }}
          from: SellSolar Price Bot <${{ env.MAIL_USERNAME }}>
          subject: "SellSolar: Nightly Rate Run (${{ steps.prices.outputs.report_date }}) - ${{ steps.prices.outputs.carried_forward_count }} Carried Forward"
          body: |
            Assalam o Alaikum,

            The automated 12:00 AM Pakistan solar rate check completed for ${{ steps.prices.outputs.report_date }}.

            - Live matched items from Pakistani sources: ${{ steps.prices.outputs.live_matched_count }}
            - Updated rates applied automatically: ${{ steps.prices.outputs.auto_updated_count }}
            - Previous rates carried forward & lightly highlighted: ${{ steps.prices.outputs.carried_forward_count }}

            Items with no live Pakistani quote keep their last verified rate (${{ steps.prices.outputs.latest_sheet }}) and are lightly highlighted on the website.

            Site: https://sellsolar.pk/today-prices
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            - SellSolar Price Bot
