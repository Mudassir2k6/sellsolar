# Cloudflare Pages deploy (Next.js static export → dist/)
# Required GitHub Secrets:
#   CLOUDFLARE_API_TOKEN   (from Cloudflare Dashboard -> My Profile -> API Tokens -> Cloudflare Pages: Edit)
#   CLOUDFLARE_ACCOUNT_ID  (from Cloudflare Dashboard -> Overview -> Account ID)
name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js & sync dist
        run: npm run build

      - name: Detect Cloudflare Projects & Custom Domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME || 'sellsolar' }}
        run: node scripts/cloudflare-deploy-helper.mjs

      - name: Verify Cloudflare Secrets & Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_PROJECT: ${{ env.TARGET_PROJECT_NAME || secrets.CLOUDFLARE_PROJECT_NAME || 'sellsolar' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing Cloudflare Secret::CLOUDFLARE_API_TOKEN secret is missing! Please go to GitHub Repo -> Settings -> Secrets and variables -> Actions -> New repository secret and add CLOUDFLARE_API_TOKEN."
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Missing Cloudflare Secret::CLOUDFLARE_ACCOUNT_ID secret is missing! Please go to GitHub Repo -> Settings -> Secrets and variables -> Actions -> New repository secret and add CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

          echo "🚀 Deploying 'dist/' directory to Cloudflare Pages project: ${DEPLOY_PROJECT} (Production branch: main)..."
          npx wrangler pages deploy dist --project-name="${DEPLOY_PROJECT}" --branch=main --commit-dirty=true

      - name: Purge Cloudflare CDN Cache (Optional)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          echo "🧹 Attempting to purge Cloudflare CDN cache for sellsolar.pk..."
          ZONE_ID="${CLOUDFLARE_ZONE_ID}"
          if [ -z "$ZONE_ID" ]; then
            ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=sellsolar.pk" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" | grep -o '"id":"[a-f0-9]*"' | head -n 1 | cut -d'"' -f4 || true)
          fi
          
          if [ -n "$ZONE_ID" ]; then
            echo "Found Zone ID: $ZONE_ID. Triggering Purge Everything..."
            PURGE_RES=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}')
            echo "API Response: $PURGE_RES"
            if echo "$PURGE_RES" | grep -q '"success":true'; then
              echo "✅ CDN cache purged successfully!"
            else
              echo "⚠️ Purge cache failed. Please ensure your API Token has 'Zone - Cache Purge: Purge' permission."
            fi
          else
            echo "Zone ID not found. Tip: Add CLOUDFLARE_ZONE_ID secret or add 'Zone: Read' permission to CLOUDFLARE_API_TOKEN."
          fi

      - name: Commit Deployment Status Log
        continue-on-error: true
        run: |
          git config --global user.name "SellSolar CI"
          git config --global user.email "ci@sellsolar.pk"
          git add public/cf-status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: record cloudflare deployment status [skip ci]" && git push)

