name: Daily Solar Price Benchmark Update at 12:00 AM Midnight

on:
  schedule:
    # Runs every day at 19:00 UTC (which is exactly 00:00 / 12:00 AM Pakistan Standard Time PKT UTC+5)
    - cron: '0 19 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-daily-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # needed to trigger the Cloudflare deploy workflow below
    env:
      # Optional email alert (repo Settings -> Secrets and variables -> Actions)
      #   MAIL_USERNAME = Gmail address that sends the mail
      #   MAIL_PASSWORD = Gmail App Password (not the normal password)
      #   MAIL_TO       = who receives the alert (defaults to MAIL_USERNAME)
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO || secrets.MAIL_USERNAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Midnight Solar Price Update (Preserving Customer & Dealer Ads)
        id: prices
        run: node scripts/update-today-prices.js

      - name: Commit and push if prices updated
        id: commit
        run: |
          git config --global user.name "SellSolar Price Bot"
          git config --global user.email "bot@sellsolar.pk"
          git add src/data/todayPricesData.js public/daily_price_update_log.json
          if git diff --staged --quiet; then
            echo "No price changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: auto-update today's solar market benchmark prices (12:00 AM)"
          git pull --rebase origin main
          git push origin main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with the default GITHUB_TOKEN do NOT start the push-triggered deploy,
      # so start the Cloudflare deploy explicitly (workflow_dispatch is allowed for GITHUB_TOKEN).
      - name: Deploy updated prices to sellsolar.pk
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloudflare.yml --ref main

      # Date-wise prices are ALWAYS shown on the website (latest sheet is carried forward),
      # but tell the owner by email when no new rates were added for the day.
      - name: Email alert - no price change
        if: steps.prices.outputs.price_status == 'NO_CHANGE' && env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ env.MAIL_USERNAME }}
          password: ${{ env.MAIL_PASSWORD }}
          to: ${{ env.MAIL_TO }}
          from: SellSolar Price Bot <${{ env.MAIL_USERNAME }}>
          subject: "SellSolar: No price change for ${{ steps.prices.outputs.report_date }}"
          body: |
            Assalam o Alaikum,

            No new solar prices were added for ${{ steps.prices.outputs.report_date }}.

            The website still shows the date-wise price page for ${{ steps.prices.outputs.report_date }}
            using the latest verified sheet (${{ steps.prices.outputs.latest_sheet }}), with all changes shown as "stable".

            If rates did change in the market, add a new dated sheet to src/data/todayPricesData.js
            and push it - the site will publish it automatically.

            Site: https://sellsolar.pk/today-prices
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            - SellSolar Price Bot
