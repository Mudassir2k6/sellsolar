[build]
  command = "npm run build"
  publish = "dist"

# WWW → apex
[[redirects]]
  from = "https://www.sellsolar.pk/*"
  to = "https://sellsolar.pk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.sellsolar.pk/*"
  to = "https://sellsolar.pk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://sellsolar.pk/*"
  to = "https://sellsolar.pk/:splat"
  status = 301
  force = true

# Index file cleanup
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
