[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# WWW → apex
[[redirects]]
  from = "https://www.sellsolar.pk/*"
  to = "https://sellsolar.pk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.sellsolar.pk/*"
  to = "https://sellsolar.pk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://sellsolar.pk/*"
  to = "https://sellsolar.pk/:splat"
  status = 301
  force = true

# Legacy path aliases
[[redirects]]
  from = "/today-prices"
  to = "/prices"
  status = 301

[[redirects]]
  from = "/load-calculator"
  to = "/calculator"
  status = 301

[[redirects]]
  from = "/about-us"
  to = "/about"
  status = 301

[[redirects]]
  from = "/help-center"
  to = "/help"
  status = 301

[[redirects]]
  from = "/contact-us"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/safety-tips"
  to = "/safety"
  status = 301

[[redirects]]
  from = "/report"
  to = "/report-issue"
  status = 301

[[redirects]]
  from = "/terms-of-service"
  to = "/terms"
  status = 301

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy"
  status = 301

[[redirects]]
  from = "/cookie-policy"
  to = "/cookies"
  status = 301

[[redirects]]
  from = "/change-password"
  to = "/password"
  status = 301

[[redirects]]
  from = "/installation"
  to = "/install"
  status = 301

[[redirects]]
  from = "/request-installation"
  to = "/install"
  status = 301

# Dynamic listing deep-links (client-routed)
[[redirects]]
  from = "/listing/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
