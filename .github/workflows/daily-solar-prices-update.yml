name: Daily Solar Price Benchmark Update at 12:00 AM Midnight

on:
  schedule:
    # Runs every day at 19:00 UTC (which is exactly 00:00 / 12:00 AM Pakistan Standard Time PKT UTC+5)
    - cron: '0 19 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-daily-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Midnight Solar Price Update (Preserving Customer & Dealer Ads)
        run: node scripts/update-today-prices.js

      - name: Commit and push if prices updated
        run: |
          git config --global user.name "SellSolar Price Bot"
          git config --global user.email "bot@sellsolar.pk"
          git add src/data/todayPricesData.js public/daily_price_update_log.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update today's solar market benchmark prices (12:00 AM)" && git push)
